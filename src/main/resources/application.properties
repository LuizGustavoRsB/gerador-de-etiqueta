# Host local por padrao. No Docker, QUARKUS_HTTP_HOST=0.0.0.0 permite acesso ao contêiner.
quarkus.http.host=${QUARKUS_HTTP_HOST:127.0.0.1}
quarkus.http.port=${PORT:8080}
quarkus.http.limits.max-body-size=20M
quarkus.http.limits.max-form-attribute-size=20M

# No Windows, defina OCR_COMMAND para o caminho do tesseract.exe se necessário.
# No Docker, o comando padrão é o Tesseract instalado na imagem Linux.
ocr.command=${OCR_COMMAND:tesseract}
ocr.language=${OCR_LANGUAGE:eng+por}
